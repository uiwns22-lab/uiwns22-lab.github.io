<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="박수민의 개인 홈페이지입니다." />
    <title>박수민 | Park Sumin</title>
    <script>
      try {
        if (localStorage.getItem("theme") === "dark") document.documentElement.dataset.theme = "dark";
      } catch (error) {}
    </script>
    <style>
      :root {
        --blue: #0066cc;
        --blue-dark: #2997ff;
        --ink: #1d1d1f;
        --canvas: #ffffff;
        --parchment: #f5f5f7;
        --tile-dark: #272729;
        --tile-dark-alt: #2a2a2c;
        --dark-copy: #ffffff;
        --dark-muted: #cccccc;
        --font: "Apple SD Gothic Neo", "Noto Sans KR", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      }

      :root[data-theme="dark"] {
        --ink: #ffffff;
        --blue-dark: #0066cc;
        --canvas: #161617;
        --parchment: #202022;
        --tile-dark: #f5f5f7;
        --tile-dark-alt: #ffffff;
        --dark-copy: #1d1d1f;
        --dark-muted: #4b4b4d;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.47; letter-spacing: -0.374px; }
      button, a { font: inherit; }

      .global-nav { height: 44px; background: #000; color: #fff; }
      .nav-content { display: flex; align-items: center; justify-content: space-between; width: min(100% - 40px, 980px); height: 100%; margin: 0 auto; }
      .nav-name { font-size: 12px; letter-spacing: -0.12px; }
      .theme-toggle { padding: 7px 12px; color: #fff; background: #1d1d1f; border: 0; border-radius: 8px; font-size: 14px; letter-spacing: -0.224px; cursor: pointer; }
      .theme-toggle:hover { background: #333; }
      .theme-toggle:focus-visible { outline: 2px solid #0071e3; outline-offset: 2px; }
      .theme-toggle:active { transform: scale(.95); }

      .hero { min-height: 660px; padding: 80px 24px; background: var(--canvas); text-align: center; }
      .hero-copy { max-width: 980px; margin: 0 auto; }
      h1 { margin: 0; font-family: var(--font); font-size: clamp(42px, 6vw, 56px); font-weight: 600; line-height: 1.07; letter-spacing: -0.28px; }
      .english-name { margin: 10px 0 32px; font-family: var(--font); font-size: clamp(21px, 3vw, 28px); font-weight: 400; line-height: 1.14; letter-spacing: .196px; }
      .profile-photo { display: block; width: min(100%, 240px); aspect-ratio: 4 / 5; margin: 0 auto; object-fit: cover; object-position: center 25%; box-shadow: rgb(0 0 0 / 22%) 3px 5px 30px; }

      .about, .interests { padding: 80px 24px; text-align: center; }
      .about { background: var(--parchment); }
      .interests { background: var(--canvas); }
      .section-inner { width: min(100%, 760px); margin: 0 auto; }
      .about p { margin: 0; font-family: var(--font); font-size: clamp(21px, 3vw, 28px); font-weight: 400; line-height: 1.3; letter-spacing: .196px; }
      .interest-list { display: flex; justify-content: center; flex-wrap: wrap; gap: 16px 28px; padding: 0; margin: 0; list-style: none; font-size: 17px; }
      .interest-list li { font-weight: 600; }
      .details { padding: 80px 24px; background: var(--tile-dark); color: var(--dark-copy); text-align: center; }
      .details-inner { width: min(100%, 980px); margin: 0 auto; }
      h2 { margin: 0 0 22px; font-family: var(--font); font-size: clamp(34px, 5vw, 40px); font-weight: 600; line-height: 1.1; letter-spacing: -0.28px; }
      .school { max-width: 720px; margin: 0 auto 42px; color: var(--dark-muted); font-family: var(--font); font-size: clamp(21px, 3vw, 28px); font-weight: 400; line-height: 1.14; letter-spacing: .196px; }
      .contact-list { display: flex; justify-content: center; flex-wrap: wrap; gap: 28px; padding: 0; margin: 0; list-style: none; }
      .contact-list a { color: var(--blue-dark); text-decoration: none; }
      .contact-list a:hover, .contact-list a:focus-visible { text-decoration: underline; text-underline-offset: 4px; }
      .label { color: var(--dark-copy); font-weight: 600; }

      @media (max-width: 640px) {
        .nav-content { width: min(100% - 32px, 980px); }
        .hero, .about, .interests, .details { padding: 64px 24px; }
        .hero { min-height: 0; }
        .english-name { margin-bottom: 28px; }
        .contact-list { display: grid; gap: 16px; text-align: left; }
        .contact-list li { display: grid; gap: 2px; }
      }
    </style>
  </head>
  <body>
    <nav class="global-nav" aria-label="페이지 메뉴">
      <div class="nav-content">
        <span class="nav-name">Park Sumin</span>
        <button class="theme-toggle" type="button" aria-pressed="false">다크 모드</button>
      </div>
    </nav>

    <main>
      <section class="hero" aria-labelledby="name">
        <div class="hero-copy">
          <h1 id="name">박수민</h1>
          <p class="english-name">Park Sumin</p>
          <img class="profile-photo" src="assets/profile.jpg" alt="박수민 프로필 사진" />
        </div>
      </section>

      <section class="about" aria-labelledby="about-title">
        <div class="section-inner">
          <h2 id="about-title">소개</h2>
          <p>안녕하세요. 첨단융합학부에 재학 중인 26학번 박수민입니다. 차세대지능형반도체전공과 융합데이터과학전공 복수전공을 희망합니다.</p>
        </div>
      </section>

      <section class="interests" aria-labelledby="interests-title">
        <div class="section-inner">
          <h2 id="interests-title">관심사</h2>
          <ul class="interest-list">
            <li>통계학</li>
            <li>AI</li>
            <li>물리학</li>
            <li>계산화학</li>
          </ul>
        </div>
      </section>

      <section class="details" aria-labelledby="details-title">
        <div class="details-inner">
          <h2 id="details-title">Contact</h2>
          <p class="school">School of Transdisciplinary Innovations, Seoul National University</p>
          <ul class="contact-list">
            <li><span class="label">Phone</span> <a href="tel:+821031320479">+82-10-3132-0479</a></li>
            <li><span class="label">Email</span> <a href="mailto:uiwns22@snu.ac.kr">uiwns22@snu.ac.kr</a></li>
          </ul>
        </div>
      </section>
    </main>

    <script>
      const themeToggle = document.querySelector(".theme-toggle");
      const updateThemeButton = () => {
        const isDark = document.documentElement.dataset.theme === "dark";
        themeToggle.setAttribute("aria-pressed", String(isDark));
        themeToggle.textContent = isDark ? "라이트 모드" : "다크 모드";
      };
      themeToggle.addEventListener("click", () => {
        const isDark = document.documentElement.dataset.theme === "dark";
        document.documentElement.dataset.theme = isDark ? "" : "dark";
        try { localStorage.setItem("theme", isDark ? "light" : "dark"); } catch (error) {}
        updateThemeButton();
      });
      updateThemeButton();
    </script>
  </body>
</html>
